spring:
  application:
    name: taskflow

  # Load DB credentials and secrets from the root .env file.
  # Two paths so it works whether you run from backend/ (mvnw) or the repo root (IDE).
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match the tables.
    hibernate:
      ddl-auto: validate
    # Don't keep DB connections open while rendering HTTP responses.
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  # ?size=1000000 is capped at 100, so one request can't load the whole table.
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}

# Swagger UI at /swagger-ui.html, OpenAPI JSON at /v3/api-docs
springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    persist-authorization: true # keep the pasted JWT after a page refresh
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
